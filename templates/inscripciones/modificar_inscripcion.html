{% extends "layout.html" %}
{% import '_macros.html' as macros %}

{% block container %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Modificar Inscripción</h1>
    
    <form method="POST" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 max-w-lg mx-auto border border-gray-200">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        {% if form.id.data %}
            {{ macros.camposNuevos(form.id, class="hidden") }}
        {% endif %}
        
        <div class="mb-6">
            <label for="curso_id" class="block text-gray-700 font-semibold mb-2">Curso</label>
            <select name="curso_id" id="curso_id" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                <option value="">Seleccione un curso</option>
                {% for curso in cursos %}
                    <option value="{{ curso.id }}" {% if form.curso_id.data == curso.id %}selected{% endif %}>
                        {{ curso.nom }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-6">
            <label for="alumno_id" class="block text-gray-700 font-semibold mb-2">Alumno</label>
            <select name="alumno_id" id="alumno_id" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                <option value="">Seleccione un alumno</option>
                {% for alumno in alumnos %}
                    <option value="{{ alumno.id }}" {% if form.alumno_id.data == alumno.id %}selected{% endif %}>
                        {{ alumno.nom }} {{ alumno.apa }} {{ alumno.ama }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="flex items-center justify-between">
            <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline transition-colors">
                Guardar Cambios
            </button>
            <a href="{{ url_for('inscripciones.inscripciones') }}" class="inline-block align-baseline font-bold text-sm text-gray-500 hover:text-gray-800">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
