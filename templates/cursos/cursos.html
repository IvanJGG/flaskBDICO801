{% extends "layout.html" %} {% block container %}

<div class="py-32 relative overflow-x-auto sm:rounded-lg">
  <a
    href="{{ url_for('curso.nuevo_curso') }}"
    class="w-max mb-4 bg-green-500 text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-green-600"
  >
    <svg
      class="w-6 h-6 text-white-800 dark:text-white"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M16 12h4m-2 2v-4M4 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
      />
    </svg>

    Nuevo Curso
  </a>
  <table
    class="py-2 w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
  >
    <thead
      class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
    >
      <tr>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Curso</div>
        </th>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Descripción</div>
        </th>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Maestro</div>
        </th>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Editar</div>
        </th>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Detalles del curso</div>
        </th>
        <th scope="col" class="px-6 py-3">
          <div class="flex items-center">Eliminar</div>
        </th>
      </tr>
    </thead>
    <tbody>
      {%for c in cursos%}
      <tr
        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200"
      >
        <th
          scope="row"
          class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
        >
        {{ c.nom }}
        </th>
        <td class="px-6 py-4">{{ c.descripcion }}</td>
        <td class="px-6 py-4">{{ c.maestro_titular.nom }} {{ c.maestro_titular.apa }}</td>
        <td class="px-6 py-4 text-right">
          <a
            href="{{ url_for('curso.modificar_curso', id=c.id) }}"
            class="flex w-max items-center gap-2 bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600"
          >
            <svg
              class="w-6 h-6 text-white-800 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="square"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 19H5a1 1 0 0 1-1-1v-1a3 3 0 0 1 3-3h1m4-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm7.441 1.559a1.907 1.907 0 0 1 0 2.698l-6.069 6.069L10 19l.674-3.372 6.07-6.07a1.907 1.907 0 0 1 2.697 0Z"
              />
            </svg>

            Editar
          </a>
        </td>
        <td class="px-6 py-4 text-right">
          <a
            href="{{ url_for('curso.detalles_cursos', id=c.id) }}"
            class="flex w-max items-center gap-2 bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
          >
            <svg class="w-5 h-5 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Detalles
          </a>
        </td>
        <td class="px-6 py-4 text-right">
          <a
            href="{{ url_for('curso.eliminar_cursos', id=c.id) }}"
            class="flex w-max items-center gap-2 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
          >
            <svg
              class="w-6 h-6 text-white-800 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"
              />
            </svg>

            Eliminar
          </a>
        </td>
      </tr>
      {%endfor%}
    </tbody>
  </table>
</div>

{% endblock %}
